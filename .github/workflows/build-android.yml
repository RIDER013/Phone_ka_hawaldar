name: Build Android APK (Phone ka Hawaldar)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  release:
    types: [ published, created ]

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK via Android SDK & Gradle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'
          accept-android-sdk-licenses: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew clean assembleDebug --stacktrace --info

      - name: Organize APK Output
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/PhoneKaHawaldar-v1.0.0-debug.apk
          echo "APK successfully built at build-output/PhoneKaHawaldar-v1.0.0-debug.apk"

      # Available in the GitHub Actions tab under Artifacts
      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PhoneKaHawaldar-Android-APK
          path: build-output/PhoneKaHawaldar-v1.0.0-debug.apk
          retention-days: 30

      # Automatically publish APK to GitHub Releases tab when a release/tag is published
      - name: Upload APK to GitHub Release Assets
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/PhoneKaHawaldar-v1.0.0-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
